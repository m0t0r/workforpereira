name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # `turbo --affected` compares against `main`/`master`, never the repository's configured default
  # branch. The trunk here is `dev`, so a hardcoded default would make every pull request diff a
  # stale `main`, skip nearly every package, and pass for the wrong reason.
  #
  # Derived from the event rather than fixed, because the base is not always `dev`. On the
  # `dev` → `main` promotion pull request — the one that ships to production — a fixed `origin/dev`
  # would diff `dev` against itself, find zero affected packages, and report success having run no
  # lint, no type-check and no `db:check` at all.
  TURBO_SCM_BASE: origin/${{ github.base_ref || 'dev' }}
  # The same ref, for the same reason, read by `pnpm db:check` (ADR-0017). It decides what "already
  # on the base branch" means — which is what makes a destructive migration's marker provable
  # without inspecting a deploy log, and what makes an expand and its contract two pull requests.
  DB_CHECK_BASE: origin/${{ github.base_ref || 'dev' }}

# Every `uses:` below is pinned to a **commit SHA**, with the version it was at in the comment
# beside it. A tag is a mutable pointer the action's owner can move after anyone reviewed it, which
# is how `tj-actions/changed-files` became a secret exfiltrator in thousands of repositories without
# a single consumer changing a line. A SHA cannot be moved.
#
# The cost of a SHA pin is that it does not float, so it goes stale in silence. `.github/dependabot.yml`
# is what pays that cost — it rewrites the SHA and the comment together, weekly.

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `--affected` walks history to find the merge base.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's own cache, kept on GitHub rather than Vercel Remote Cache: CI runners are always
      # cold so caching pays, and this map has priced vendor count carefully everywhere else
      # (ADR-0022).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format
        run: pnpm format:check

      # ADR-0006's module DAG, the third and weakest of its three enforcement mechanisms — the
      # `exports` map and pnpm resolution are the other two, and both hold without this. It is its
      # own step rather than part of the gate command below because `turbo boundaries` is a turbo
      # subcommand, not a task, so `--affected` does not apply to it: it always checks everything.
      - name: Boundaries
        run: pnpm boundaries

      # ADR-0017's gate, verbatim. `test` and `db:check` are registered in `turbo.json` and defined
      # by no package yet, so turbo no-ops them — the command is correct today and needs no edit
      # when the testing lane lands. It fails if they are *unregistered*, which is why they are.
      #
      # `--affected` on pull requests, everything on merge — so a gap in affected-detection surfaces
      # one merge later instead of in production.
      # Written as two steps rather than one with an interpolated flag: an empty variable either
      # word-splits (a shellcheck warning) or passes an empty argument to turbo (an error), and
      # neither is worth the one saved line.
      - name: Lint, types, tests, migration checks (changed packages)
        if: github.event_name == 'pull_request'
        run: pnpm exec turbo run lint check-types test db:check check-contrast --affected

      - name: Lint, types, tests, migration checks
        if: github.event_name != 'pull_request'
        run: pnpm exec turbo run lint check-types test db:check check-contrast

  # Fails a pull request that *introduces* a dependency with a known advisory — before it is in the
  # lockfile on `dev`, rather than after, which is the only thing Dependabot alerts can offer.
  #
  # It reads the diff of the dependency graph, so it says nothing about advisories already present:
  # those are the alerts' job. That is what makes it safe to fail on `moderate` here without the
  # gate going permanently red on debt.
  #
  # It runs on Dependabot's own pull requests too, and that is the point — a bump whose new
  # transitive closure carries a CVE is a real and unglamorous way to import one.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # No `comment-summary-in-pr`. Posting one needs `pull-requests: write`, and GitHub hands
          # Dependabot's own pull requests a read-only token no matter what a workflow asks for —
          # so the comment would fail on exactly the pull requests this job exists to check. The
          # findings are in the job summary, which needs no permission at all.

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      # Note: a pull request from a fork receives a read-only token on a public repository, so the
      # comment step will not post. With no external contributors that is a known edge rather than
      # a broken pipeline; the fix, when it is needed, is a `workflow_run` job.
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A root task, run once across all packages, so coverage arrives as one summary rather than
      # the N that `turbo run test` produces per package (ADR-0017). It carried a self-arming guard
      # until the testing lane landed; the guard is gone because a root `vitest.config.ts` now
      # always exists and it could only ever answer "yes".
      - name: Coverage
        run: pnpm exec turbo run coverage

      # Reads the `json-summary` artifact and posts a sticky comment. No external coverage service:
      # ADR-0017 declines one explicitly, and **never gates on the number** — the seams are
      # restricted by decision, so the figure can only be raised by testing what this repo decided
      # not to test.
      #
      # Skipped for Dependabot. GitHub issues `github.actor == 'dependabot[bot]'` runs a read-only
      # `GITHUB_TOKEN` regardless of the `permissions:` block above — the elevated scope is not
      # denied, it is silently not granted — so this step would 403 on every dependency bump and
      # paint the Coverage job red for a reason that has nothing to do with coverage. The `coverage`
      # run itself still happens above, which is the part that could actually catch a regression.
      - if: github.actor != 'dependabot[bot]'
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
